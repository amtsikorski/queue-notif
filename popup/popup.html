<html>
  <head>
    <meta charset='UTF-8' />
    <style>
      :root {
        --coral: #F7CACA;
        --coral-deep: #EFA9A9;
        --periwinkle: #93A9D1;
        --tangerine: #F5A34D;
        --ink: #2E2A2A;
        --ink-soft: #8A7F7F;
        --bg: #FFFBF9;
        --border: #F0DEDE;
      }
      * {
        box-sizing: border-box;
      }
      body {
        width: 230px;
        margin: 0;
        padding: 16px 18px 18px;
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 16px;
      }
      .header h1 {
        font-size: 14px;
        font-weight: 600;
        margin: 0;
        letter-spacing: 0.01em;
      }
      .field {
        margin-bottom: 14px;
      }
      label {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 12px;
        font-weight: 600;
        color: var(--ink);
        margin-bottom: 5px;
      }
      input[type="text"],
      input[type="number"] {
        padding: 7px 9px;
        font-size: 12.5px;
        font-family: inherit;
        color: var(--ink);
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 6px;
        outline: none;
        transition: border-color 0.15s ease;
      }
      input[type="text"] {
        width: 100%;
      }
      input[type="text"]:focus,
      input[type="number"]:focus {
        border-color: var(--periwinkle);
      }
      .accordion {
        margin-bottom: 16px;
      }
      .accordion summary {
        list-style: none;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 0 8px;
        font-size: 12.5px;
        font-weight: 600;
        cursor: pointer;
        color: var(--ink);
      }
      .accordion summary::-webkit-details-marker {
        display: none;
      }
      .accordion summary .chevron {
        transition: transform 0.15s ease;
        font-size: 10px;
        color: var(--ink-soft);
      }
      .accordion[open] summary .chevron {
        transform: rotate(90deg);
      }
      .accordion .accordion-body {
        padding-top: 4px;
      }
      .inline-field {
        margin-bottom: 14px;
      }
      .inline-field .row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .inline-field label {
        margin-bottom: 0;
        white-space: nowrap;
      }
      .inline-field input[type="number"] {
        width: 70px;
        text-align: center;
      }
      .inline-field .hint {
        display: block;
        font-size: 11px;
        font-weight: 400;
        color: var(--ink-soft);
        margin-top: 4px;
      }
      .checkbox-field {
        margin-bottom: 14px;
      }
      .checkbox-field label {
        display: flex;
        align-items: flex-start;
        gap: 7px;
        font-size: 12px;
        font-weight: 600;
        color: var(--ink);
        margin-bottom: 0;
        cursor: pointer;
      }
      .checkbox-field input[type="checkbox"] {
        width: 14px;
        height: 14px;
        margin: 3px 0 0;
        flex: none;
        cursor: pointer;
      }
      .tooltip {
        cursor: pointer;
        font-size: 11px;
        line-height: 1;
        width: 14px;
        height: 14px;
        flex: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: var(--coral-deep);
        color: #fff;
        font-style: normal;
        font-weight: 700;
      }
      .tooltip:hover {
        background: var(--periwinkle);
      }
      .actions {
        margin-top: 4px;
      }
      button {
        width: 100%;
        transition: background-color 0.2s ease, color 0.2s ease;
        background-color: var(--coral);
        color: var(--ink);
        border-radius: 7px;
        text-align: center;
        text-decoration: none;
        padding: 10px 16px;
        font-size: 12.5px;
        font-weight: 600;
        font-family: inherit;
        border: none;
        cursor: pointer;
      }
      button:hover {
        background-color: var(--periwinkle);
        color: white;
      }
      #stop {
        background-color: #fff;
        color: var(--ink);
        border: 1px solid var(--border);
      }
      #stop:hover {
        background-color: #fff;
        color: var(--periwinkle);
        border-color: var(--periwinkle);
      }
      #status {
        display: none;
        align-items: center;
        gap: 6px;
        font-size: 11.5px;
        color: var(--ink-soft);
        margin: 10px 0 0;
      }
      #status.visible {
        display: flex;
      }
      #status .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--ink-soft);
        flex: none;
      }
      #status.active {
        color: var(--ink);
      }
      #status.active .dot {
        background: var(--tangerine);
        box-shadow: 0 0 0 3px rgba(245, 163, 77, 0.25);
      }
    </style>
  </head>
  <body>
      <div class="header">
        <h1>Queue Monitor</h1>
      </div>
      <details class="accordion">
        <summary><span class="chevron">▸</span> Discord settings</summary>
        <div class="accordion-body">
          <div class="field">
            <label for="webhook">Webhook URL <i class="tooltip" data-help="webhook">i</i></label>
            <input type="text" name="webhook" id="webhook" placeholder="https://discord.com/api/webhooks/...">
          </div>
          <div class="field" style="margin-bottom: 0;">
            <label for="userId">User ID <i class="tooltip" data-help="userid">i</i></label>
            <input type="text" name="userId" id="userId" placeholder="e.g. 123456789012345678">
          </div>
        </div>
      </details>
      <div class="inline-field">
        <div class="row">
          <label for="frequency">Update every</label>
          <input type="number" name="frequency" id="frequency" min="1">
        </div>
        <span class="hint">minutes, while in queue</span>
      </div>
      <div class="inline-field">
        <div class="row">
          <label for="threshold">Alert below</label>
          <input type="number" name="threshold" id="threshold" min="1">
        </div>
        <span class="hint">queue position</span>
      </div>
      <div class="checkbox-field">
        <label for="estimateTime">
          <input type="checkbox" name="estimateTime" id="estimateTime">
          Add time left estimation to notification
        </label>
      </div>
      <div class="actions">
        <button id="start">Save &amp; start</button>
        <button id="stop" style="display: none;">Stop updates</button>
      </div>
      <p id="status"><span class="dot"></span><span id="statusText"></span></p>
      <script src="popup.js"></script>
  </body>
</html>
