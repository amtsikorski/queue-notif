<html>
  <head>
    <style>
      body {
        min-width: 200px;
      }
      .inputBlock {
        padding-bottom: 10px;
      }
      #frequency {
        width: 45px;
      }
    </style>
  </head>
  <body>
      <h3>Queue Monitor Settings</h3>
      <div class="inputBlock">
        <label for="webhook">Discord Webhook URL:</label>
        <input type="text" name="webhook" id="webhook">
      </div>
      <div class="inputBlock">
        <label for="frequency">Time between updates:</label><br>
        <span>every </span>
        <input type="number" name="frequency" id="frequency">
        <span> minute(s)</span>
      </div>
      <div class="inputBlock">
        <label for="threshold">Special alert when position is less than:</label>
        <input type="number" id="threshold">
      </div>
      <button id="start">Save & Start</button>
      <p id="status"></p>
      <button id="stop" style="display: none;">Stop Updates</button>
      <script src="popup.js"></script>
  </body>
</html>
